name: BYPlugin privacy preflight
on:
  push:
    branches: [upgrade/by-plugin-chat-privacy]
permissions:
  contents: read
concurrency:
  group: by-privacy-preflight
  cancel-in-progress: false
jobs:
  policies:
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Select upstream Xcode
        run: sudo xcode-select -s /Applications/Xcode_27.1.app/Contents/Developer
      - name: Find all receipt and activity senders
        run: |
          grep -RnE 'Api.functions.(messages.(setTyping|setEncryptedTyping|readHistory|readDiscussion|readSavedHistory|readMessageContents)|channels.(readHistory|readMessageContents)|stories.(readStories|incrementStoryViews)|account.updateStatus)' submodules/TelegramCore/Sources || true
      - name: Verify ABI, storage, privacy and history
        run: bash Plugins/BYPlugin/test.sh
      - name: Parse changed Swift adapters
        run: python3 .github/scripts/check_by_plugin.py
      - name: Verify release plugin configuration
        run: |
          bash Plugins/BYPlugin/build.sh
          python3 - <<'PY'
          import json
          from pathlib import Path
          metadata = json.loads(Path("build/plugin/plugin.json").read_text())
          assert metadata["feature_flags"] == 4095
          assert metadata["host_abi"] == 1
          print("Actual release packaging enables all BYPlugin 2.0 feature bits.")
          PY
          if BY_PLUGIN_FEATURES=4096 bash Plugins/BYPlugin/build.sh build/invalid-plugin; then
            echo "Out-of-range plugin features must be rejected." >&2
            exit 1
          fi
