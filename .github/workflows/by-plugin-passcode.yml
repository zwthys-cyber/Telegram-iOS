name: BYPlugin self-signed keychain verification
on:
  workflow_dispatch:
  push:
    branches: [validate/by-plugin-storage]
permissions:
  contents: read
jobs:
  passcode:
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: sudo xcode-select -s /Applications/Xcode_27.1.app/Contents/Developer
      - name: Verify private keychain scope on macOS and iOS
        run: bash Plugins/BYPlugin/test-passcode.sh
