name: Retire superseded BYPlugin build
on:
  push:
    branches: [upgrade/by-plugin-privacy-history]
    paths: [.github/workflows/by-cancel-stale-build.yml]
permissions:
  actions: write
  contents: read
jobs:
  retire:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Cancel only the superseded pre-final source build
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          status=$(gh api "repos/$BUILD_REPOSITORY/actions/runs/43723450356" --jq '.status')
          if [ "$status" != completed ]; then
            gh api --method POST "repos/$BUILD_REPOSITORY/actions/runs/43723450356/cancel"
          fi
      - name: Inspect available release caches
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_REPOSITORY: ${{ github.repository }}
        run: gh api "repos/$BUILD_REPOSITORY/actions/caches?per_page=100" --jq '.actions_caches[] | {key, ref, size_in_bytes}'
