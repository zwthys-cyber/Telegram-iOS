name: BYPlugin recorded truth log audit
on:
  push:
    branches: [upgrade/by-plugin-privacy-history]
    paths: ['.github/workflows/by-privacy-log-audit.yml', '.github/scripts/verify_by_truth_log.py', '.github/scripts/test_by_truth_log.py']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: xcode-27
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: by-privacy-tests-large-4-8-1
          run-id: 43723612877
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: build/recorded-tests
      - name: Verify parser rejection cases
        run: python3 .github/scripts/test_by_truth_log.py
      - name: Verify all recorded large-4 seeds and original XCTest result
        run: |
          python3 .github/scripts/verify_by_truth_log.py \
            build/recorded-tests/large-751-1000.test.log 751 1000 \
            --build-log build/recorded-tests/large-751-1000.log
