name: BYPlugin truth log validation
on:
  push:
    branches: [upgrade/by-plugin-privacy-history]
    paths: ['.github/workflows/by-privacy-log-audit.yml', '.github/scripts/verify_by_truth_log.py', '.github/scripts/test_by_truth_log.py']
  workflow_dispatch:
    inputs:
      run_id:
        description: Completed source run containing the recorded test artifact
        type: string
        required: true
      artifact_name:
        description: Artifact name from that run
        type: string
        required: true
      log_prefix:
        description: Recorded log filename without .log or .test.log
        type: string
        required: true
      first_seed:
        description: First expected seed
        type: number
        required: true
      last_seed:
        description: Last expected seed
        type: number
        required: true
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: xcode-27
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify parser rejection cases
        run: python3 .github/scripts/test_by_truth_log.py
      - uses: actions/download-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: ${{ inputs.artifact_name }}
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: build/recorded-tests
      - name: Verify recorded seed coverage and original XCTest result
        if: github.event_name == 'workflow_dispatch'
        env:
          LOG_PREFIX: ${{ inputs.log_prefix }}
          FIRST_SEED: ${{ inputs.first_seed }}
          LAST_SEED: ${{ inputs.last_seed }}
        run: |
          python3 .github/scripts/verify_by_truth_log.py \
            "build/recorded-tests/$LOG_PREFIX.test.log" "$FIRST_SEED" "$LAST_SEED" \
            --build-log "build/recorded-tests/$LOG_PREFIX.log"
