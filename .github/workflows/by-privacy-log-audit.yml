name: BYPlugin recorded truth log audit
on:
  push:
    branches: [upgrade/by-plugin-privacy-history]
    paths: ['.github/workflows/by-privacy-log-audit.yml', '.github/scripts/verify_by_truth_log.py', '.github/scripts/test_by_truth_log.py']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: xcode-27
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: by-privacy-tests-large-4-8-1
          run-id: 43723612877
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: build/recorded-tests
      - name: Inspect original recorded test output
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          for path in Path("build/recorded-tests").rglob("*"):
              if not path.is_file():
                  continue
              print("FILE", path.name, "bytes", path.stat().st_size)
              if path.name.endswith(".test.log"):
                  text = path.read_text(errors="replace")
                  seeds = re.findall(r"TRUTH seed=(\d+)", text)
                  print("UNIQUE_SEEDS", len(set(seeds)), "FIRST_LAST", seeds[:3], seeds[-3:])
                  for marker in ["TRUTH summary", "1-1000 failing", "failing="]:
                      offset = text.find(marker)
                      print("CONTEXT", marker, repr(text[max(0, offset - 120):offset + 2500]) if offset >= 0 else "ABSENT")
                  print("TAIL", repr(text[-4500:]))
          PY
