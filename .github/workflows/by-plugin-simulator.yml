name: BYPlugin iOS loader verification
on:
  workflow_dispatch:
  push:
    branches: [validate/by-plugin-ios-loader]
permissions:
  contents: read
jobs:
  simulator:
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_27.1.app/Contents/Developer
      - name: Verify plugin bridge under iOS dyld
        run: bash Plugins/BYPlugin/test-simulator.sh
