name: Unsigned IPA
on:
  workflow_dispatch:
  push:
    branches: [ci/unsigned-ipa]
permissions:
  contents: read
concurrency:
  group: unsigned-ipa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 350
    steps:
      - name: Require personal Telegram API credentials
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          if [[ -z "$TELEGRAM_API_ID" || -z "$TELEGRAM_API_HASH" ]]; then
            echo "::error::Add TELEGRAM_API_ID and TELEGRAM_API_HASH to repository Actions secrets using credentials for your own application at https://my.telegram.org/apps."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1
          persist-credentials: false
      - name: Select pinned Xcode
        run: |
          set -euo pipefail
          version=$(python3 -c 'import json; print(json.load(open("versions.json"))["xcode"])')
          sudo xcode-select -s "/Applications/Xcode_${version}.app/Contents/Developer"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          df -h .
      - name: Verify self-signed storage fallback
        run: |
          xcrun swiftc submodules/TelegramUI/Sources/AppStorageContainer.swift .github/scripts/AppStorageContainerTests.swift -o "$RUNNER_TEMP/test-app-storage"
          "$RUNNER_TEMP/test-app-storage"
      - name: Verify download chunk alignment
        run: |
          xcrun swiftc submodules/TelegramCore/Sources/Network/DownloadPartAlignment.swift .github/scripts/DownloadPartAlignmentTests.swift -o "$RUNNER_TEMP/test-download-alignment"
          "$RUNNER_TEMP/test-download-alignment"
      - name: Restore build cache
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/bazel-cache
          key: bazel-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('versions.json', 'MODULE.bazel.lock') }}-${{ github.sha }}
          restore-keys: |
            bazel-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('versions.json', 'MODULE.bazel.lock') }}-
      - name: Configure unsigned device build
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          python3 .github/scripts/configure_unsigned.py
          cat >> .bazelrc <<'BAZEL'
          build --features=disable_legacy_signing
          build --define=local_pro_features=true
          BAZEL
      - name: Build release arm64
        run: |
          set -euo pipefail
          mkdir -p build/artifacts
          python3 -u build-system/Make/Make.py \
            --cacheDir="$RUNNER_TEMP/bazel-cache" \
            build \
            --configurationPath=build/unsigned-configuration.json \
            --codesigningInformationPath=build-system/fake-codesigning \
            --configuration=release_arm64 \
            --buildNumber="$GITHUB_RUN_NUMBER" \
            2>&1 | tee build/build.log
      - name: Package and verify unsigned IPA
        run: python3 .github/scripts/package_unsigned.py
      - name: Upload IPA and verification report
        uses: actions/upload-artifact@v4
        with:
          name: Swiftgram-unsigned-arm64-${{ github.run_number }}
          path: build/artifacts/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_number }}-${{ github.run_attempt }}
          path: build/build.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Save build cache
        continue-on-error: true
        if: ${{ always() && hashFiles('versions.json') != '' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/bazel-cache
          key: bazel-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('versions.json', 'MODULE.bazel.lock') }}-${{ github.sha }}
