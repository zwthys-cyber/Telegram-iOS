name: BYPlugin and unsigned IPA
on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    branches: [upgrade/swiftgram-13.2.1-by-plugin]
    paths-ignore:
      - '**/*.md'
      - '.github/workflows/by-cancel-stale-build.yml'
      - '.github/workflows/by-privacy-*.yml'
      - '.github/scripts/run_by_privacy_tests.py'
  push:
    branches:
      - upgrade/swiftgram-13.2.1-by-plugin
      - master
    paths-ignore:
      - '**/*.md'
      - '.github/workflows/by-cancel-stale-build.yml'
      - '.github/workflows/by-privacy-*.yml'
      - '.github/scripts/run_by_privacy_tests.py'
permissions:
  contents: read
concurrency:
  group: by-plugin-${{ github.ref }}
  # Let the running build save its cache; keep only the newest pending revision.
  cancel-in-progress: false
jobs:
  plugin:
    name: Build and verify injected plugin
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Select upstream Xcode
        run: |
          set -euo pipefail
          version=$(python3 -c 'import json; print(json.load(open("versions.json"))["xcode"])')
          sudo xcode-select -s "/Applications/Xcode_${version}.app/Contents/Developer"
          xcodebuild -version
          sw_vers
      - name: Verify injection ABI and migrated policies
        run: bash Plugins/BYPlugin/test.sh
      - name: Verify iOS simulator injection and local saving policies
        run: bash Plugins/BYPlugin/test-simulator.sh
      - name: Check adapter Swift syntax
        run: python3 .github/scripts/check_by_plugin.py
      - name: Build injectable arm64 dylib
        run: |
          bash Plugins/BYPlugin/build.sh
          python3 - <<'PY'
          import json
          from pathlib import Path
          metadata = json.loads(Path("build/plugin/plugin.json").read_text())
          assert metadata["feature_flags"] == 511, "Release dylib is missing BYPlugin 2.0 features"
          assert metadata["host_abi"] == 1
          print("Packaged BYPlugin 2.0 feature mask verified:", metadata["feature_flags"])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: BYPlugin-arm64-${{ github.run_number }}
          path: build/plugin/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
  ipa:
    name: Build and verify unsigned IPA
    needs: plugin
    runs-on: xcode-27
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
          submodules: recursive
      - name: Select upstream Xcode
        run: |
          set -euo pipefail
          version=$(python3 -c 'import json; print(json.load(open("versions.json"))["xcode"])')
          sudo xcode-select -s "/Applications/Xcode_${version}.app/Contents/Developer"
          xcodebuild -version
          sw_vers
          df -h .
      - name: Configure personal unsigned build and parallelism
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          python3 .github/scripts/configure_unsigned.py
          python3 .github/scripts/configure_by_build.py
      - name: Restore Bazel cache
        uses: actions/cache/restore@v4
        id: cache
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/bazel-cache
          key: by-bazel-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('versions.json', 'MODULE.bazel.lock', '.gitmodules') }}-${{ github.sha }}
          restore-keys: |
            by-bazel-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('versions.json', 'MODULE.bazel.lock', '.gitmodules') }}-
      - name: Build complete release arm64 app
        run: python3 -u .github/scripts/build_by_release.py
      - name: Package and verify base IPA
        run: python3 .github/scripts/package_unsigned.py
      - uses: actions/upload-artifact@v4
        with:
          name: Swiftgram-unsigned-arm64-${{ github.run_number }}
          path: |
            build/artifacts/Swiftgram-unsigned.ipa
            build/artifacts/SHA256SUMS.txt
            build/artifacts/verification.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: by-build-log-${{ github.run_number }}-${{ github.run_attempt }}
          path: build/build.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Stop Bazel before archiving its cache
        if: always()
        id: stop_bazel
        continue-on-error: true
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          for executable in Path("build-input").glob("bazel-*-darwin-arm64"):
              subprocess.run([str(executable.resolve()), "shutdown"], check=True, timeout=60)
          PY
      - name: Save Bazel cache
        if: ${{ always() && steps.stop_bazel.outcome == 'success' && steps.cache.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/bazel-cache
          key: by-bazel-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('versions.json', 'MODULE.bazel.lock', '.gitmodules') }}-${{ github.sha }}
